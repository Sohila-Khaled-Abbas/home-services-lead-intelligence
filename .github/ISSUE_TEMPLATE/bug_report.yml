name: Bug report
description: Report a reproducible defect in the extraction or data pipeline.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove credentials, personal information, and unreviewed contact data before submitting.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and why it is incorrect.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run ... 2. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "e.g. 3.14.6"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Windows 11"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant error output
      description: Redact tokens, private details, and contact data.
    validations:
      required: false
